[package]
name = "picompress"
version = "0.1.0"
edition = "2024"
authors = ["lfcypo"]
description = "A command line image compressor for common image formats"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
image = "0.25.10"
imagequant = "4.4.1"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
png = "0.18.1"
webp = "0.3.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
