[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0436"
]

[licenses]
version = 2


allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    "GPL-3.0-or-later"
]

confidence-threshold = 1.0

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"